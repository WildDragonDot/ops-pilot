name: Release — OpsPilot AI

on:
  push:
    tags:
      - 'v*'  # Triggers on v1.0.0, v2.1.3, etc.

permissions:
  contents: write  # Required to create GitHub Releases

jobs:
  # ─── Pre-release Validation ────────────────────────────────────────────────
  validate:
    name: Validate Release Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog generation

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Backend validation
      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Generate Prisma Client
        run: cd backend && npm run db:generate

      - name: Backend TypeScript type check
        run: cd backend && npx tsc --noEmit

      - name: Backend Build
        run: cd backend && npm run build
        env:
          NODE_ENV: production

      - name: Backend Security Audit
        run: cd backend && npm audit --audit-level=high
        continue-on-error: true

      - name: Backend Tests
        run: cd backend && npm test
        env:
          DATABASE_URL: file:./test.db
          JWT_SECRET: release-ci-test-secret
          NODE_ENV: test

      # Frontend validation
      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Frontend TypeScript type check
        run: cd frontend && npx tsc --noEmit

      - name: Frontend Build
        run: cd frontend && npm run build
        env:
          VITE_API_BASE: /api
          NODE_ENV: production

      - name: Frontend Security Audit
        run: cd frontend && npm audit --audit-level=high
        continue-on-error: true

  # ─── Package Build Artifacts ───────────────────────────────────────────────
  package:
    name: Package Release Artifacts
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build backend
        run: |
          cd backend
          npm ci
          npm run db:generate
          npm run build
        env:
          NODE_ENV: production

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
        env:
          VITE_API_BASE: /api
          NODE_ENV: production

      - name: Create release archive — backend
        run: |
          tar -czf opspilot-backend-${{ steps.version.outputs.version }}.tar.gz \
            -C backend dist package.json prisma/schema.prisma

      - name: Create release archive — frontend
        run: |
          tar -czf opspilot-frontend-${{ steps.version.outputs.version }}.tar.gz \
            -C frontend dist

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-release-${{ steps.version.outputs.version }}
          path: opspilot-backend-${{ steps.version.outputs.version }}.tar.gz

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-release-${{ steps.version.outputs.version }}
          path: opspilot-frontend-${{ steps.version.outputs.version }}.tar.gz

  # ─── Create GitHub Release ─────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-release-${{ needs.package.outputs.version }}

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-release-${{ needs.package.outputs.version }}

      - name: Generate Changelog from git log
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --oneline --no-merges -20)
          else
            CHANGELOG=$(git log --oneline --no-merges ${PREV_TAG}..HEAD)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.package.outputs.version }}
          name: "OpsPilot AI ${{ needs.package.outputs.version }}"
          body: |
            ## 🚀 OpsPilot AI ${{ needs.package.outputs.version }}

            ### What's Changed
            ```
            ${{ steps.changelog.outputs.changelog }}
            ```

            ### Release Artifacts
            | Package | Description |
            |---|---|
            | `opspilot-backend-*.tar.gz` | Express + Prisma backend (Node.js) |
            | `opspilot-frontend-*.tar.gz` | React + Vite production bundle |

            ### Deployment
            See [RELEASE_CHECKLIST.md](./RELEASE_CHECKLIST.md) for step-by-step deployment instructions.

            ---
            *Built by GitHub Actions — OpsPilot AI CI/CD Pipeline*
          draft: false
          prerelease: ${{ contains(needs.package.outputs.version, '-beta') || contains(needs.package.outputs.version, '-rc') }}
          files: |
            opspilot-backend-${{ needs.package.outputs.version }}.tar.gz
            opspilot-frontend-${{ needs.package.outputs.version }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
